services:
    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        container_name: backend
        ports:
            - "8001:8000"
        env_file:
            - ./backend/.env
        restart: always
        healthcheck:
            test:
                [
                    "CMD",
                    "python",
                    "-c",
                    "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=3)",
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 60s
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]
    agent:
        build:
            context: ./backend
            dockerfile: Dockerfile.agent
        container_name: agent
        env_file:
            - ./backend/.env
        depends_on:
            - backend
        restart: always
        healthcheck:
            test:
                [
                    "CMD",
                    "python",
                    "-c",
                    "import urllib.request as u; u.urlopen('http://localhost:8081/', timeout=3)",
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 60s
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]
    frontend:
        build:
            context: ./frontend
            args:
                NEXT_PUBLIC_LIVEKIT_URL: ${NEXT_PUBLIC_LIVEKIT_URL}
                NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
                NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
                NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        container_name: frontend
        ports:
            - "3000:3000"
        env_file:
            - ./frontend/.env
        depends_on:
            - backend
        restart: always
