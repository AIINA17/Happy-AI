services:
    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        container_name: backend
        ports:
            - "8000:8000"
        env_file:
            - ./backend/.env
        restart: always
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]
    agent:
        build:
            context: ./backend
            dockerfile: Dockerfile.agent
        container_name: agent
        env_file:
            - ./backend/.env
        depends_on:
            - backend
        restart: always
        deploy:
            resources:
                reservations:
                    devices:
                        - driver: nvidia
                          count: all
                          capabilities: [gpu]
    frontend:
        build:
            context: ./frontend/web
        container_name: frontend
        ports:
            - "3000:3000"
        env_file:
            - ./frontend/web/.env
        depends_on:
            - backend
        restart: always
